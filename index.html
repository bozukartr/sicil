<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0d07">
<title>SİCİL — Askerî Kariyer Dosyası</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="tag">
      <div id="insBox"></div>
      <div class="idt">
        <div class="careerBadge" id="careerBadge">Subay Kariyeri</div>
        <div class="rankname" id="rankName">Harbiyeli</div>
        <div class="sub" id="forceName"></div>
      </div>
      <button id="fileBtn" aria-label="Sicil dosyasını aç"><span class="fi" aria-hidden="true">▤</span><span class="fl">Sicil</span></button>
    </div>
    <div class="hudmeta">
      <div class="clock"><span id="mAge"></span><i></i><span id="mSrv"></span></div>
      <div id="pips"></div>
    </div>
  </div>
  <div id="gauges"></div>
  <div id="stage">
    <div class="card" id="cardB"></div>
    <div class="card" id="cardA">
      <div class="stamp l" id="stampL"></div>
      <div class="stamp r" id="stampR"></div>
      <div class="chead">
        <div class="l"><div class="who" id="who"></div><div class="role" id="role"></div></div>
        <div class="place" id="place"></div>
      </div>
      <div class="cbody"><div id="text"></div></div>
    </div>
    <div id="decisionFeedback" role="status" aria-live="polite"></div>
  </div>
  <div id="choices">
    <button class="ch" id="chL"><span class="k">◀ SOL</span><span id="chLt"></span></button>
    <button class="ch" id="chR"><span class="k">SAĞ ▶</span><span id="chRt"></span></button>
  </div>
  <div id="hint">kaydır ya da dokun</div>

  <div id="file" class="hide">
    <h2>Sicil Dosyası</h2>
    <div id="fileRows"></div>
    <div class="note" id="fileNote"></div>
    <button class="btn" id="fileClose" style="margin-top:auto">Kapat</button>
  </div>

  <div id="promo" class="hide">
    <div id="promoIns"></div>
    <div class="eyebrow" id="promoTop">Terfi</div>
    <div id="promoRank"></div>
    <div id="promoNote"></div>
    <div id="promoNext"></div>
    <button class="btn p" id="promoBtn">Göreve devam</button>
  </div>

  <div class="screen hide" id="exam">
    <div class="examShell">
      <div class="examTop"><span id="examStep">Aday Seçmeleri</span><b id="examScore">0 PUAN</b></div>
      <div class="examTrack" id="examTrack"></div>
      <div id="examBody"></div>
    </div>
  </div>

  <div class="screen" id="start">
    <div class="eyebrow">Personel Temin · Aday Dosyası</div>
    <h1>Sicil<small>kariyerin sınavla başlar</small></h1>
    <p class="lead">Kuvvetini seç, üç aşamalı aday sınavına gir. Başarı Harp Okulu yolunu açar; başarısızlık kariyerini er olarak sahadan başlatır.</p>
    <div class="forces" id="forceList"></div>
  </div>

  <div class="screen hide" id="end">
    <div class="eyebrow" id="endTop"></div>
    <h1 id="endTitle" style="font-size:clamp(21px,6.6vw,30px);letter-spacing:.09em"></h1>
    <p class="lead" id="endText"></p>
    <div id="endStats"></div>
    <div id="endNote" style="font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--brass);max-width:33ch;line-height:1.7"></div>
    <button class="btn p" id="again">Yeni dosya aç</button>
  </div>
</div>

<script src="ranks.js"></script>
<script src="storage.js"></script>
<script src="game.js"></script>
<script src="exam.js"></script>
<script src="events-officer.js"></script>
<script src="events-field.js"></script>
</body>
</html>
